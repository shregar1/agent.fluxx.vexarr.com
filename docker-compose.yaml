version: '3.8'

services:
  fluxx-agent:
    build: .
    image: fluxx-agent:latest
    container_name: fluxx-agent
    environment:
      - FLUXX_NODE_ID=standalone-node
      - RUST_LOG=info
    ports:
      - "3000:3000"
      - "7946:7946"
    volumes:
      - ./data/agent:/data
    networks:
      - fluxx-network

  prometheus:
    image: prom/prometheus:latest
    container_name: fluxx-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - fluxx-network

  grafana:
    image: grafana/grafana:latest
    container_name: fluxx-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - fluxx-network

networks:
  fluxx-network:
    driver: bridge
