name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Install cross-compile deps (Linux only)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libpcap-dev
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Install pcap (Linux native)
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build
        run: cargo build --profile dist --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p artifact
          bin="target/${{ matrix.target }}/dist/fluxx${{ matrix.ext }}"
          cp "$bin" "artifact/fluxx-${{ matrix.target }}${{ matrix.ext }}"
          cd artifact
          if [ "$RUNNER_OS" = "Windows" ]; then
            certutil -hashfile "fluxx-${{ matrix.target }}.exe" SHA256 | sed -n 2p > "fluxx-${{ matrix.target }}.exe.sha256"
          else
            shasum -a 256 "fluxx-${{ matrix.target }}${{ matrix.ext }}" > "fluxx-${{ matrix.target }}${{ matrix.ext }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fluxx-${{ matrix.target }}
          path: artifact/*
          retention-days: 7

  release:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
