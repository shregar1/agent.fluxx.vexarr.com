[package]
name = "fluxx-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
config = "0.14"
tokio-tungstenite = "0.21"
futures-util = "0.3"
tokio-retry = "0.3"
url = "2.5"
quinn = "0.11"
tonic = "0.11"
prost = "0.12"
aya = "0.1"
aya-log = "0.1"
aya-obj = "0.1"
bytes = "1.6"
