[package]
name = "fluxx-agent"
version = "0.1.0"
edition = "2024"
authors = ["Fluxx Team <team@fluxx.dev>"]
description = "High-performance observability agent"
license = "Apache-2.0"
repository = "https://github.com/fluxx/agent"
keywords = ["observability", "monitoring", "metrics", "logs", "tracing"]
categories = ["development-tools", "network-programming"]
rust-version = "1.78"

# Explicit binary configuration - only includes src/main.rs, not tests
[[bin]]
name = "fluxx-agent"
path = "src/main.rs"

[dependencies]
num_cpus = "1.16"
simd-json = { version = "0.13", features = ["serde_impl", "runtime-detection"] }
zstd = { version = "0.13", features = ["pkg-config"] }
lz4 = "1.24"
byteorder = "1.5"
memmap2 = "0.9"
crossbeam = "0.8"
parking_lot = "0.12"
async-trait = "0.1"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
config = "0.14"
tokio-tungstenite = "0.21"
futures-util = "0.3"
tokio-retry = "0.3"
url = "2.5"
quinn = "0.11"
tonic = "0.11"
prost = "0.12"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
bytes = "1.6"
rand = "0.8"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.12"
aya-log = "0.2"
aya-obj = "0.1"

# Release profile optimized for binary size
[profile.release]
opt-level = "z"          # Optimize for size
lto = true               # Enable Link Time Optimization
codegen-units = 1        # Single codegen unit for better optimization
strip = true             # Strip debug symbols
panic = "abort"          # Use abort instead of unwind (smaller)

# Profile for distribution (maximum size reduction)
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Profile for CI/testing (faster builds, still optimized)
[profile.ci]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = false
panic = "unwind"
